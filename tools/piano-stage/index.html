<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Hours · Endless Piano</title><link rel="stylesheet" href="stage.css?v=3"></head>
<body><header><a href="http://127.0.0.1:8774/">AFTER HOURS <span>/ PIANO STUDIO</span></a><span class="tag">LIVE-VORSCHAU · ZUFALLSNOTEN · OHNE TON</span><button id="fullscreen">Vollbild ↗</button></header>
<main><section id="stage" aria-label="Animierte Klaviatur mit fallenden Zufallsnoten"><img id="background" src="assets/after-hours.png" alt="Dunkle Manhattan-Bar bei Nacht"><div class="shade"></div><canvas id="piano"></canvas><div class="title"><span>NEW YORK · AFTER DARK</span><h1>After Hours</h1><i></i></div><div id="hint">Zufällige Noten · visuelle Studie</div></section>
<div class="controls"><button id="pause" aria-pressed="false">Ⅱ Pause</button><label>Tempo <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speedValue">1.0×</output></label><label>Notendichte <input id="density" type="range" min="1" max="5" step="1" value="3"></label><label>Hintergrund <input id="brightness" type="range" min="15" max="100" value="75"></label><div class="spacer"></div><label class="button" for="upload">Bild wechseln ↥</label><input id="upload" type="file" accept="image/*" hidden><button id="reset">Bar zurücksetzen</button></div>
<div class="transport"><span id="clock">0:00</span><input aria-label="Songposition" id="seek" type="range" min="0" max="1" step="0.01" value="0"></div><footer><span>88 Tasten · Gold / Champagner · Hintergrund frei austauschbar</span><span>Leertaste: Pause · F: Vollbild</span></footer><p id="message" role="status"></p></main><script src="stage.js?v=3"></script></body></html>
